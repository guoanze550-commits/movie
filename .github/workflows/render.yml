name: Render film
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project directory (e.g. fixtures/smoke or films/my-film)'
        required: true
        default: fixtures/smoke
      profile:
        description: Render profile
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/setup.sh
      - run: npx --prefix upstream/lemo-opuscar playwright-core install-deps chromium
      - name: Validate input and render with official tools
        env:
          FILM_PROJECT: ${{ inputs.project }}
          FILM_PROFILE: ${{ inputs.profile }}
        run: bash scripts/render.sh "$FILM_PROJECT" "$FILM_PROFILE"
      - name: Collect outputs including failures
        if: always()
        run: python3 scripts/collect-artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: film-render-${{ github.run_id }}
          path: _artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Download uploaded render artifact
        if: success()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: film-render-${{ github.run_id }}
          path: _downloaded
      - name: Verify downloaded artifact MP4
        if: success()
        run: python3 scripts/verify-downloaded.py _downloaded
