name: Studio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg build-essential pkg-config libx264-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-n7.1.5-3a0867c2-ubuntu24-x264-v1
      - name: Build verified FFmpeg 7.1.5 from official source
        run: bash scripts/install-ffmpeg.sh
      - name: Install pinned dependencies
        run: bash scripts/setup.sh
      - name: Install browser OS dependencies
        run: npx --prefix upstream/lemo-opuscar playwright-core install-deps chromium
      - name: Unit, browser and real render checks
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee reports/ci-validation.log
      - name: Publish diagnostics summary
        if: always()
        run: python3 scripts/ci-summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: studio-validation
          path: |
            reports/
            fixtures/smoke/out/
            fixtures/smoke/stills/
          if-no-files-found: warn
          retention-days: 14
      - name: Download uploaded validation artifact
        if: success()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-validation
          path: _downloaded
      - name: Verify downloaded artifact MP4
        if: success()
        run: python3 scripts/verify-downloaded.py _downloaded
  official-render-smoke:
    needs: test
    uses: ./.github/workflows/render.yml
    with:
      project: fixtures/smoke
      profile: preview
