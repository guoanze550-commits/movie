name: Studio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned dependencies
        run: bash scripts/setup.sh
      - name: Install browser OS dependencies
        run: npx --prefix upstream/lemo-opuscar playwright-core install-deps chromium
      - name: Unit, browser and real render checks
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee reports/ci-validation.log
      - name: Publish diagnostics summary
        if: always()
        run: python3 scripts/ci-summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: studio-validation
          path: |
            reports/
            fixtures/smoke/out/
            fixtures/smoke/stills/
          if-no-files-found: warn
          retention-days: 14
